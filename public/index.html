<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>聊天室 · 入口</title>
  <link rel="icon" type="image/png" href="/img/logo.png">
  <link rel="apple-touch-icon" href="/img/logo.png">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      background: #f5f6fa;
      color: #1f2430;
    }
    .card { text-align: center; }
    .splash-logo {
      width: 72px;
      height: 72px;
      display: block;
      margin: 0 auto 16px;
      border-radius: 20px;
      box-shadow: 0 8px 24px rgba(31, 36, 48, 0.12);
    }
    h1 { font-size: 22px; font-weight: 600; margin: 0 0 8px; }
    p { color: #6b7280; font-size: 14px; margin: 0; }
  </style>
</head>
<body>
  <div class="card">
    <img class="splash-logo" src="/img/logo.png" alt="聊天室 Logo">
    <h1>实时聊天室</h1>
    <p>正在跳转…</p>
  </div>

  <script src="/js/api.js"></script>
  <script>
    // 入口页：判断该去登录页还是聊天页。
    //
    // 为什么不能只看"localStorage 里有没有 token"？
    //   因为 token 可能已经过期了（有效期 7 天）。
    //   只看有没有值的话，会把用户送进 chat.html；
    //   chat.html 发现 token 无效又把他踢回登录页 ——
    //   用户看到的就是"页面闪了两下"，体验很差。
    //
    // 所以这里真的调一次 /api/me 验证。验证通过才进聊天页。
    (async function () {
      if (!API.getToken()) {
        location.replace('/login.html');
        return;
      }

      try {
        await API.getMe();
        location.replace('/chat.html');
      } catch {
        // token 无效或已过期。api.js 内部在 401 时已经清掉了本地登录态，
        // 这里直接去登录页即可。
        API.clearAuth();
        location.replace('/login.html');
      }
    })();
  </script>
</body>
</html>
